<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nettleser</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/nettleser.svg" alt="">Nettleser</div>
    <nav>
      <a href="/pasient">Pasientjournal</a>
      <a href="/post">Post</a>
    </nav>
  </header>
  <main>
    <section class="card">
      <h2>Godkjente nettsteder</h2>
      <p class="muted">Nettleseren åpner bare godkjente nettsteder. Sporing blokkeres, alle forbindelser
        er krypterte, og nettstedene ser ikke hvilket system du bruker. Mangler du et nettsted? Spør IT.</p>
      <div id="groups"></div>
    </section>
  </main>
  <script src="/static/common.js"></script>
  <script>
    function card(s) {
      const inner = `<b>${esc(s.navn)}</b><span class="muted">${esc(s.beskrivelse)}</span>`;
      // "kommune.no" covers every municipality (oslo.kommune.no …), so it has no single page to open.
      if (s.domene === "kommune.no") return `<div class="site">${inner}<span class="domain">*.kommune.no</span></div>`;
      return `<a class="site" rel="noreferrer" href="https://www.${esc(s.domene)}/">${inner}<span class="domain">${esc(s.domene)}</span></a>`;
    }
    api("/api/nettsteder").then((groups) => {
      document.getElementById("groups").innerHTML = groups.map((g) => `
        <h3 class="group">${esc(g.gruppe)}</h3>
        <div class="sites">${g.nettsteder.map(card).join("")}</div>`).join("");
    });
  </script>
</body>
</html>
