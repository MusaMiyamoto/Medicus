<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Helsepersonell</title>
  <!-- A neutral health worker: white coat and stethoscope, stylized face. Drawn for Medicus. -->
  <defs>
    <radialGradient id="bg" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#36ad74"/>
      <stop offset="1" stop-color="#0d4f2e"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="64" cy="64" r="64"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>
  <g clip-path="url(#circle)">
    <!-- shoulders: white coat over a green shirt -->
    <path d="M14 128 C 16 98, 36 86, 64 86 C 92 86, 112 98, 114 128 Z" fill="#f4faf6"/>
    <path d="M52 87 L 64 108 L 76 87 Z" fill="#2f8f5c"/>
    <path d="M52 87 L 60 104 L 50 112 L 44 92 Z M76 87 L 68 104 L 78 112 L 84 92 Z" fill="#dfeee5"/>
    <!-- neck and head -->
    <rect x="56" y="70" width="16" height="18" rx="6" fill="#cfe9da"/>
    <circle cx="64" cy="54" r="22" fill="#cfe9da"/>
    <path d="M42 52 C 42 34, 54 28, 64 28 C 76 28, 87 35, 86 52 C 82 44, 74 40, 64 40 C 54 40, 46 44, 42 52 Z" fill="#0f5a35"/>
    <!-- stethoscope -->
    <path d="M50 89 C 46 100, 48 112, 58 114" fill="none" stroke="#123b28" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M78 89 C 82 100, 80 112, 70 114" fill="none" stroke="#123b28" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="64" cy="116" r="5" fill="#123b28"/>
    <circle cx="64" cy="116" r="2.2" fill="#9fd8b8"/>
    <!-- green cross on the pocket -->
    <g transform="translate(92 104)">
      <rect x="-2" y="-6" width="4" height="12" rx="0.8" fill="#1a7f4b"/>
      <rect x="-6" y="-2" width="12" height="4" rx="0.8" fill="#1a7f4b"/>
    </g>
  </g>
</svg>
