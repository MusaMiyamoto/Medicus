<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120">
  <!-- The MEDICUS OS wordmark: the "I" is a green medical cross. Shared by the boot screen and
       the start-up animation (build.sh inlines it). Text is centered on x=220. -->
  <defs>
    <linearGradient id="wm-title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c6ecd6"/>
    </linearGradient>
    <linearGradient id="wm-cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe0ad"/>
      <stop offset="1" stop-color="#2fa36b"/>
    </linearGradient>
    <linearGradient id="wm-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe0ad" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fe0ad" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fe0ad" stop-opacity="0"/>
    </linearGradient>
    <filter id="wm-soft" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#021209" flood-opacity="0.6"/>
    </filter>
  </defs>
  <g filter="url(#wm-soft)" font-family="Noto Sans, DejaVu Sans, sans-serif">
    <!-- "MED" ends just left of the cross, "CUS" starts just right of it -->
    <text x="166" y="44" font-size="34" font-weight="800" letter-spacing="7" text-anchor="end" fill="url(#wm-title)">MED</text>
    <g transform="translate(192 32)">
      <rect x="-4.6" y="-13" width="9.2" height="26" rx="1.6" fill="url(#wm-cross)"/>
      <rect x="-13" y="-4.6" width="26" height="9.2" rx="1.6" fill="url(#wm-cross)"/>
    </g>
    <text x="214" y="44" font-size="34" font-weight="800" letter-spacing="7" fill="url(#wm-title)">CUS</text>
    <text x="311" y="44" font-size="34" font-weight="300" letter-spacing="7" fill="#7fe0ad">OS</text>
    <text x="220" y="72" font-size="11" letter-spacing="3.2" text-anchor="middle" fill="#ffffff" fill-opacity="0.72">TRYGG ARBEIDSSTASJON FOR HELSEPERSONELL</text>
  </g>
  <rect x="90" y="88" width="260" height="1.2" fill="url(#wm-rule)"/>
  <circle cx="220" cy="88.6" r="2.4" fill="#7fe0ad"/>
</svg>
