<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>Medicus – Asklepiosstaven</title>
  <!-- The Rod of Asclepius: one staff, one serpent. Drawn for Medicus; the symbol itself is ancient and free to use. -->
  <defs>
    <radialGradient id="disc" cx="0.32" cy="0.26" r="0.85">
      <stop offset="0" stop-color="#36ad74"/>
      <stop offset="0.55" stop-color="#1a7f4b"/>
      <stop offset="1" stop-color="#0d4f2e"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f0e3"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#04210f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="62" fill="url(#disc)"/>
  <circle cx="64" cy="64" r="57.5" fill="none" stroke="url(#ring)" stroke-width="1.6"/>

  <g filter="url(#lift)">
    <!-- staff -->
    <rect x="59.8" y="18" width="8.4" height="95" rx="4.2" fill="url(#ivory)"/>
    <circle cx="64" cy="17.5" r="6.2" fill="url(#ivory)"/>
    <!-- serpent: green outline under the white body separates it from the staff where they cross;
         the tail is drawn thinner so the body tapers -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 83 C86 79 88 66 64 62 C42 58 41 45 62 41 C78 38 84 33 81 26" stroke="#1a7f4b" stroke-width="13"/>
      <path d="M53 105 C40 100 42 87 64 83" stroke="#1a7f4b" stroke-width="10"/>
      <path d="M64 83 C86 79 88 66 64 62 C42 58 41 45 62 41 C78 38 84 33 81 26" stroke="url(#ivory)" stroke-width="7.2"/>
      <path d="M53 105 C40 100 42 87 64 83" stroke="url(#ivory)" stroke-width="4.6"/>
    </g>
    <!-- head -->
    <ellipse cx="80.5" cy="23" rx="7.2" ry="5.2" transform="rotate(-35 80.5 23)" fill="url(#ivory)" stroke="#1a7f4b" stroke-width="2.2"/>
    <circle cx="82.6" cy="21" r="1.3" fill="#0d4f2e"/>
  </g>
</svg>
