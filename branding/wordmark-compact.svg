<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 44" width="206" height="44">
  <!-- MED✚CUS on one line, for the login screen. The "I" is a green medical cross. -->
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4f2e1"/>
    </linearGradient>
    <linearGradient id="c" gradientUnits="userSpaceOnUse" x1="0" y1="-12" x2="0" y2="12">
      <stop offset="0" stop-color="#7fe0ad"/>
      <stop offset="1" stop-color="#2fa36b"/>
    </linearGradient>
  </defs>
  <g font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="32" font-weight="800" letter-spacing="5" fill="url(#t)">
    <text x="2" y="34">MED</text>
    <!-- one shape with one gradient, so there are no seams where the arms meet -->
    <path transform="translate(104.5 22.5)" fill="url(#c)" stroke="url(#c)" stroke-width="1.5" stroke-linejoin="round"
          d="M-3.55 -11.25 H3.55 V-3.55 H11.25 V3.55 H3.55 V11.25 H-3.55 V3.55 H-11.25 V-3.55 H-3.55 Z"/>
    <text x="124" y="34">CUS</text>
  </g>
</svg>
