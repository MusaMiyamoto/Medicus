<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <!-- Boot menu background. The boot menu text is drawn by the boot loader from about y=220 down,
       so the brand sits centered above it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#05231a"/>
      <stop offset="1" stop-color="#11583a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.17" r="0.42">
      <stop offset="0" stop-color="#4cc38a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4cc38a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c6ecd6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe0ad" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fe0ad" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7fe0ad" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#021209" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#glow)"/>
  <!-- faint rings around the logo -->
  <g fill="none" stroke="#7fe0ad" stroke-opacity="0.08">
    <circle cx="320" cy="62" r="62"/>
    <circle cx="320" cy="62" r="86"/>
    <circle cx="320" cy="62" r="112"/>
  </g>
  <g transform="translate(272 14) scale(0.75)"><!-- The Rod of Asclepius: one staff, one serpent. Drawn for Medicus; the symbol itself is ancient and free to use. -->
  <defs>
    <radialGradient id="logo-disc" cx="0.32" cy="0.26" r="0.85">
      <stop offset="0" stop-color="#36ad74"/>
      <stop offset="0.55" stop-color="#1a7f4b"/>
      <stop offset="1" stop-color="#0d4f2e"/>
    </radialGradient>
    <linearGradient id="logo-ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="logo-ivory" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f0e3"/>
    </linearGradient>
    <filter id="logo-lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#04210f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="62" fill="url(#logo-disc)"/>
  <circle cx="64" cy="64" r="57.5" fill="none" stroke="url(#logo-ring)" stroke-width="1.6"/>

  <g filter="url(#logo-lift)">
    <!-- staff -->
    <rect x="59.8" y="18" width="8.4" height="95" rx="4.2" fill="url(#logo-ivory)"/>
    <circle cx="64" cy="17.5" r="6.2" fill="url(#logo-ivory)"/>
    <!-- serpent: green outline under the white body separates it from the staff where they cross;
         the tail is drawn thinner so the body tapers -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64 83 C86 79 88 66 64 62 C42 58 41 45 62 41 C78 38 84 33 81 26" stroke="#1a7f4b" stroke-width="13"/>
      <path d="M53 105 C40 100 42 87 64 83" stroke="#1a7f4b" stroke-width="10"/>
      <path d="M64 83 C86 79 88 66 64 62 C42 58 41 45 62 41 C78 38 84 33 81 26" stroke="url(#logo-ivory)" stroke-width="7.2"/>
      <path d="M53 105 C40 100 42 87 64 83" stroke="url(#logo-ivory)" stroke-width="4.6"/>
    </g>
    <!-- head -->
    <ellipse cx="80.5" cy="23" rx="7.2" ry="5.2" transform="rotate(-35 80.5 23)" fill="url(#logo-ivory)" stroke="#1a7f4b" stroke-width="2.2"/>
    <circle cx="82.6" cy="21" r="1.3" fill="#0d4f2e"/>
  </g></g>
  <g filter="url(#soft)" font-family="Noto Sans, DejaVu Sans, sans-serif" text-anchor="middle">
    <text x="320" y="150" font-size="34" letter-spacing="7" fill="url(#title)">
      <tspan font-weight="800">MEDICUS</tspan><tspan font-weight="300" fill="#7fe0ad" dx="22">OS</tspan>
    </text>
    <text x="320" y="174" font-size="11" letter-spacing="3.2" fill="#ffffff" fill-opacity="0.72">TRYGG ARBEIDSSTASJON FOR HELSEPERSONELL</text>
  </g>
  <rect x="190" y="188" width="260" height="1.2" fill="url(#rule)"/>
  <circle cx="320" cy="188.6" r="2.4" fill="#7fe0ad"/>
</svg>
