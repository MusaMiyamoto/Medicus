<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Fjell</title>
  <!-- Snowy mountains at dawn. Drawn for Medicus; free to use within the project. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7fb5"/>
      <stop offset="0.6" stop-color="#f3b9a8"/>
      <stop offset="1" stop-color="#fde4cf"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfd9ea"/>
    </linearGradient>
    <linearGradient id="valley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6b5a"/>
      <stop offset="1" stop-color="#173528"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- distant range -->
  <path d="M0 620 L 260 470 L 420 560 L 640 380 L 860 540 L 1080 420 L 1300 560 L 1520 400 L 1740 520 L 1920 450 L 1920 760 L 0 760 Z" fill="#9aa9c7"/>
  <!-- main peaks: rock with snow caps -->
  <path d="M120 820 L 560 300 L 760 520 L 980 260 L 1260 600 L 1460 380 L 1820 820 Z" fill="#5d6b86"/>
  <path d="M560 300 L 640 395 L 600 380 L 560 420 L 520 380 L 470 410 Z" fill="url(#snow)"/>
  <path d="M980 260 L 1090 390 L 1040 370 L 990 420 L 950 380 L 900 410 L 860 395 Z" fill="url(#snow)"/>
  <path d="M1460 380 L 1550 490 L 1500 470 L 1460 510 L 1420 480 L 1390 470 Z" fill="url(#snow)"/>
  <path d="M980 260 L 1260 600 L 1100 600 L 1040 470 Z" fill="#4a566e" opacity="0.6"/>
  <path d="M560 300 L 760 520 L 660 560 L 600 420 Z" fill="#4a566e" opacity="0.6"/>
  <!-- green valley -->
  <path d="M0 860 C 300 780, 700 820, 960 790 S 1600 800, 1920 770 L 1920 1080 L 0 1080 Z" fill="url(#valley)"/>
  <path d="M0 960 C 400 900, 900 950, 1300 920 S 1800 930, 1920 910 L 1920 1080 L 0 1080 Z" fill="#12291f"/>
  <!-- a small lake -->
  <ellipse cx="1300" cy="880" rx="260" ry="26" fill="#a9c6e3" opacity="0.75"/>
</svg>
