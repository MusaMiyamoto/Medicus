#!/usr/sbin/nft -f
# Medicus OS firewall.
#   In:  nothing from outside can connect in. Malformed packets are dropped and ping is
#        rate-limited, so a flood costs the machine as little as possible.
#   Out: users and apps can only reach this machine (the closed Medicus ecosystem) and the
#        health-network VPN. The browser reaches approved health websites only through the
#        web filter (tinyproxy). Only the system itself (root, e.g. security updates) and the
#        virus-database updater may go online.
# With the VPN kill switch on (medicus-vpn på), even the system can only use the VPN.
# A large DDoS attack has to be stopped upstream (network operator / Norsk helsenett); a single
# PC can only avoid being an easy target, which is what this does.

flush ruleset

table inet filter {
  set helsenett4 {
    type ipv4_addr
    flags interval
  }

  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state invalid drop
    ct state established,related accept

    # Malformed TCP flag combinations used by scans and floods.
    tcp flags & (fin|syn|rst|psh|ack|urg) == 0x0 drop
    tcp flags & (fin|syn|rst|psh|ack|urg) == fin|psh|urg drop
    tcp flags & (syn|rst) == syn|rst drop
    tcp flags & (fin|syn) == fin|syn drop

    # IPv6 neighbour discovery is needed for the network to work at all.
    icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert, packet-too-big } accept
    # Ping and other ICMP: allowed, but rate-limited.
    meta l4proto { icmp, ipv6-icmp } limit rate 5/second burst 10 packets accept
    meta l4proto { icmp, ipv6-icmp } drop

    # Address from the network (DHCP) and the VPN tunnel's own replies.
    udp dport 68 accept
    ip6 saddr fe80::/10 udp dport 546 accept

    limit rate 5/minute log prefix "medicus-blokkert: " level info
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy drop;
    oif "lo" accept
    ct state established,related accept
    meta l4proto { icmp, ipv6-icmp } accept
    oifname "helsenett" accept
    ip daddr @helsenett4 tcp dport 443 accept
    meta skuid 0 accept
    meta skuid "_apt" accept
    # The web filter (only approved health websites) and virus-database updates.
    meta skuid "tinyproxy" udp dport 53 accept
    meta skuid "tinyproxy" tcp dport { 53, 443 } accept
    meta skuid "clamav" udp dport 53 accept
    meta skuid "clamav" tcp dport { 53, 80, 443 } accept
  }
}
