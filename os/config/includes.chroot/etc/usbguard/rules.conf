# Medicus USB policy: only what a clinical workstation needs. Everything else is blocked,
# including USB memory sticks (mass storage), cameras, network adapters and Bluetooth.
#   01 = headsets for dictation, 03 = keyboards and mice, 09 = USB hubs, 0b = chip-card readers
# "match-all" means EVERY interface on the device must be in the list, so a "keyboard"
# that also hides a memory stick is blocked too.
allow with-interface match-all { 01:*:* 03:*:* 09:*:* 0b:*:* }
