# Medicus web filter. Medicus Nettleser sends all web traffic through this proxy, which only
# lets through the approved health websites listed in /etc/tinyproxy/filter (generated from
# medicus/nettsteder.py). Only this machine can use it.
User tinyproxy
Group tinyproxy
Port 8888
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
Syslog On
LogLevel Notice
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 50
DisableViaHeader Yes

Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes

# Only encrypted (HTTPS) connections can be tunnelled.
ConnectPort 443
