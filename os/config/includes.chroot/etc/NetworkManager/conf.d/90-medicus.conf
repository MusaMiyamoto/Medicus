# Medicus network privacy and hardening.
[device]
# Random hardware address while scanning for Wi-Fi, so the PC can't be tracked between places.
wifi.scan-rand-mac-address=yes

[connection]
# A stable but private hardware address per network.
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
# Private IPv6 addresses.
ipv6.ip6-privacy=2
# No local network name broadcasting (mDNS/LLMNR): nothing for others on the Wi-Fi to discover.
connection.mdns=0
connection.llmnr=0
