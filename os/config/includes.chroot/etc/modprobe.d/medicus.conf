# Medicus: hardware a health workstation never needs. "install ... /bin/false" stops the module
# loading even when something asks for it by name.
# Floppy drives (also shows up as a "Floppy Disk" in virtual machines).
install floppy /bin/false
# FireWire and Thunderbolt-era DMA ports can read memory directly; not used here.
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
# Rare network protocols with a history of kernel bugs.
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
# Cameras built into laptops are not used by Medicus.
install uvcvideo /bin/false
# Bluetooth is off (the service is masked); keep the drivers out too.
install bluetooth /bin/false
install btusb /bin/false
