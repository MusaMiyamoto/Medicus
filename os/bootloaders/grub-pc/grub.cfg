source /boot/grub/config.cfg

# Nobody can edit the start command or open the GRUB command line: the admin password is random
# and thrown away at build time (build.sh fills in @GRUB_PASSWORD_HASH@). Starting needs no password.
set superusers="medicus"
password_pbkdf2 medicus @GRUB_PASSWORD_HASH@
set timeout=5

menuentry "Start Medicus" --unrestricted --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
